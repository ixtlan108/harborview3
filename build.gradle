plugins {
	id 'java'
    id 'idea'
    id 'org.springframework.boot' version '4.0.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'hamilton108'
version = '0.9.2'

repositories {
	mavenCentral()
}

dependencies {
	implementation project(':oahu')
	implementation project(':vega')

	//implementation 'org.springframework.boot:spring-boot-starter-amqp'
	// implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
	//implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	//implementation 'org.springframework.boot:spring-boot-starter-cache'
	//implementation 'redis.clients:jedis:4.3.2'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.3'
	implementation 'com.google.guava:guava:32.0.1-android'
	implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'
    implementation("org.jsoup:jsoup:1.22.1")

	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'redis.clients:jedis:6.0.0'

    implementation("org.apache.httpcomponents.client5:httpclient5:5.6")

	//implementation("com.yahoofinance-api:YahooFinanceAPI:3.17.0")

	//implementation 'jakarta.validation:jakarta.validation-api:3.0.2'
	//implementation 'ch.qos.logback:logback-classic:1.2.10'

	implementation 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	//testImplementation 'org.springframework.amqp:spring-rabbit-test'
	testImplementation 'org.mockito:mockito-junit-jupiter:5.3.1'

    //testImplementation("org.htmlunit:htmlunit:4.21.0")
    implementation("org.htmlunit:htmlunit:4.21.0")
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.register('integrationTest', Test) {
    description = "Run integration tests"
    group = "verification"
    testClassesDirs = sourceSets.integration.output.classesDirs
    classpath = sourceSets.integration.runtimeClasspath
    systemProperty('spring.profiles.active', 'integration')
}

sourceSets {
    integration  {
        java {
            compileClasspath += sourceSets.main.output + sourceSets.test.output
            runtimeClasspath += sourceSets.main.output + sourceSets.test.output
            srcDirs = ['src/integration/java']
        }
    }
}

configurations {
    integrationImplementation.extendsFrom(testImplementation)
    integrationRuntimeOnly.extendsFrom(testRuntimeOnly)
}

tasks.named('integrationTest') {
    useJUnitPlatform()
}


idea {
    module {
        testSources.from(sourceSets.integration.java.srcDirs)
    }
}
